[package]
name = "geo_quiz"
version = "0.1.0"
edition = "2024"
authors = ["Guilhem <guilhem.mathieux.pro@gmail.com>"]

[lib]
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"
name = "geo_quiz"

[[bin]]
path = "src/main.rs"
name = "geo_quiz"

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = [ "compat-1-2", "backend-winit", "renderer-femtovg", "backend-android-activity-06"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
webbrowser = "1.0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"


[dev-dependencies]
csv = "1.2"
num-format = "0.4.4"

[build-dependencies]
slint-build = "=1.17.1" 
